# Dua service saja: app dan db. Tidak ada load balancer, cache, atau queue -
# tidak ada requirement yang memintanya dan §4.3 menempatkannya di luar scope.
services:
  app:
    # Image diberi nama tetap. `docker compose up` memakai image ini bila sudah
    # ada dan hanya mem-build-nya bila belum ada (first run). Source code
    # di-bind-mount, jadi perubahan kode TIDAK butuh rebuild — `--build` hanya
    # perlu setelah Dockerfile, composer.lock, atau docker/entrypoint.sh berubah.
    image: ioms-app:local
    # Image ini hanya ada secara lokal; tanpa pull_policy, Compose mencoba
    # menariknya dari Docker Hub lebih dulu dan menampilkan "pull access denied"
    # sebelum akhirnya mem-build.
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ioms_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_ENV: "${APP_ENV:-local}"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      SESSION_SECURE: "${SESSION_SECURE:-false}"
      # Di dalam network Docker, MySQL selalu di 3306. Kedua nilai ini sengaja
      # hardcoded dan mengabaikan DB_HOST/DB_PORT dari .env - dua key itu hanya
      # dipakai saat menjalankan aplikasi atau test dari host, di luar Docker.
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-ioms}"
      DB_USERNAME: "${DB_USERNAME:-ioms_user}"
      DB_PASSWORD: "${DB_PASSWORD:-ioms_secret}"
      DB_DATABASE_TEST: "${DB_DATABASE_TEST:-ioms_test}"
      UPLOAD_PATH: /var/www/html/storage/uploads
    volumes:
      - .:/var/www/html
      # Bind mount di atas menimpa seluruh /var/www/html, termasuk vendor/ hasil
      # composer install saat build. Tanpa volume ini, clone bersih yang belum
      # pernah menjalankan composer di host akan fatal error saat autoload -
      # persis skenario "demo dari folder bersih" pada SC-001.
      - vendor_data:/var/www/html/vendor
      - uploads_data:/var/www/html/storage/uploads
    # app tidak boleh start sebelum MySQL benar-benar siap menerima koneksi.
    # Ini penyebab paling umum demo dari folder bersih terlihat rusak (SC-001).
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ioms_net

  db:
    image: mysql:8.0
    container_name: ioms_db
    restart: unless-stopped
    # Port publikasi ke host memakai key sendiri, bukan DB_PORT. Default 3307
    # agar tidak bentrok dengan MySQL yang sudah berjalan di host (mis. Laragon).
    # Di-bind ke 127.0.0.1 saja: cukup untuk menjalankan test dari host, tanpa
    # membuka MySQL — dengan kredensial development-nya — ke jaringan lain.
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root_secret}"
      MYSQL_DATABASE: "${DB_DATABASE:-ioms}"
      MYSQL_USER: "${DB_USERNAME:-ioms_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-ioms_secret}"
      # Dibaca oleh script init agar nama database test tidak hardcoded.
      DB_DATABASE_TEST: "${DB_DATABASE_TEST:-ioms_test}"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Binary log MySQL 8 aktif secara default, dan selama itu user non-SUPER
      # (ioms_user) tidak boleh membuat trigger (error 1419). Trigger append-only
      # stock_ledger (database/005_ledger_append_only.sql, tech-debt TD-9) dibuat
      # oleh migration dengan user aplikasi, jadi izin ini diperlukan.
      - --log-bin-trust-function-creators=1
    volumes:
      - db_data:/var/lib/mysql
      # Database test dibuat sekali saat volume pertama kali diinisialisasi.
      - ./database/docker-init:/docker-entrypoint-initdb.d:ro
    # Healthcheck lewat TCP, bukan socket. Saat volume pertama kali
    # diinisialisasi, MySQL menjalankan server sementara yang hanya menerima
    # socket; ping lewat socket sudah lulus di fase itu, padahal port 3306 belum
    # terbuka. Container app — yang langsung menjalankan migration — akan
    # mendapat "Connection refused" dan restart berulang kali.
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h127.0.0.1
        - --protocol=tcp
        - -uroot
        - -p${DB_ROOT_PASSWORD:-root_secret}
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - ioms_net

volumes:
  db_data:
  uploads_data:
  vendor_data:

networks:
  ioms_net:
    driver: bridge
