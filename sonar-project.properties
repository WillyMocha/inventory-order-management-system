sonar.projectKey=inventory-order-management-system
sonar.projectName=inventory-order-management-system

sonar.sources=app
sonar.tests=tests

sonar.sourceEncoding=UTF-8

sonar.exclusions=\
    tests/**,\
    vendor/**,\
    storage/**,\
    bootstrap/cache/**,\
    app/Http/Controllers/Swagger/**

sonar.test.inclusions=tests/**

# Dihasilkan oleh `docker compose exec app composer test:coverage`. Path di dalamnya
# relatif terhadap root project, sehingga cocok walaupun scanner berjalan di
# container lain (mis. sonarsource/sonar-scanner-cli dengan mount /usr/src).
sonar.php.coverage.reportPaths=coverage/clover.xml
