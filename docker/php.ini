; PHP runtime configuration for the application container.
; Loaded from /usr/local/etc/php/conf.d/, so it overrides the base image defaults.

; -----------------------------------------------------------------------------
; Version disclosure
; -----------------------------------------------------------------------------
; Stop PHP emitting "X-Powered-By: PHP/8.4.x" on every response.
;
; Apache's `Header always unset X-Powered-By` was tried first and did NOT work — PHP adds
; this header at the SAPI layer, past where mod_headers can reliably strip it. Turning it
; off at the source is the correct fix, and it covers CLI and every SAPI rather than only
; responses that happen to pass through mod_headers.
expose_php = Off

; -----------------------------------------------------------------------------
; Error handling (FR-067, NFR-006)
; -----------------------------------------------------------------------------
; A user must never see an exception class, stack trace, SQL, filesystem path or
; credential. Diagnostics go to stderr, which Apache forwards to the container's output,
; so `docker compose logs app` is the one place to look.
;
; public/index.php sets these too, for the CLI scripts and any SAPI that does not read
; this file. Both layers are deliberate: whichever runs first, the guarantee holds.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

; -----------------------------------------------------------------------------
; Uploads (research R-006)
; -----------------------------------------------------------------------------
; The application enforces its own 2 MB limit by content sniffing in ProductImageService
; (T065). These are the outer guard rails, set slightly above it so the application's own
; validation is what rejects an oversized file — with a clear message — rather than PHP
; discarding the request before any code runs.
file_uploads = On
upload_max_filesize = 4M
post_max_size = 8M
max_file_uploads = 5

; -----------------------------------------------------------------------------
; Limits
; -----------------------------------------------------------------------------
memory_limit = 256M
max_execution_time = 60

; -----------------------------------------------------------------------------
; Character encoding
; -----------------------------------------------------------------------------
; Matches the database charset and the escaping helper's 'UTF-8' argument.
default_charset = "UTF-8"

; Session cookie hardening is set in code by app/Http/Session.php (T021) rather than here,
; because it depends on runtime configuration — SESSION_COOKIE_SECURE is only switched on
; when the app is actually served over HTTPS.
