# Response-header hardening (security standard §3, Security misconfiguration).
#
# NAMING MATTERS: Debian's Apache ships conf-enabled/security.conf containing
# "ServerTokens OS", and conf files load in alphanumeric order. An earlier version of
# this file was called security-hardening.conf, which sorts BEFORE security.conf
# ('-' = 0x2D precedes '.' = 0x2E) — so Debian's default silently overrode it and the
# server kept advertising "Apache/2.4.68 (Debian)". The zzz- prefix makes this load last.
# Verified by reading the Server header over HTTP, not by assuming.

# Announce the product only — no version, no OS.
ServerTokens Prod

# No version footer on generated error pages.
ServerSignature Off

# PHP's own version banner is suppressed at the source with expose_php=Off in
# docker/php.ini. `Header always unset X-Powered-By` was tried here first and did NOT
# work — PHP adds that header past the point where mod_headers can strip it. Left
# documented rather than silently dropped, so nobody re-adds the ineffective version.

# Do not leak the referring URL to third-party origins.
Header always set Referrer-Policy "same-origin"

# Set here rather than in PHP so they cover every response, including static assets that
# never reach the interpreter. public/index.php deliberately does not set them, which is
# why there is exactly one copy of each on a response.
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"

# Isolate this browsing context from any window that opened it.
Header always set Cross-Origin-Opener-Policy "same-origin"

# Trace requests are not used by the application and can assist header-reflection attacks.
TraceEnable Off
