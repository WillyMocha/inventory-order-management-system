# Apache virtual host for the application container.
#
# Kept as a real file rather than generated inside the Dockerfile: a vhost assembled from
# a long printf is unreadable and, as this project found out, easy to break silently.

<VirtualHost *:80>
    DocumentRoot ${APACHE_DOCUMENT_ROOT}

    <Directory ${APACHE_DOCUMENT_ROOT}>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # Single front controller: any path that is not a real file on disk is handled
        # by public/index.php. Nothing above the document root — app/, config/, views/,
        # database/, .env — is reachable over HTTP at all.
        FallbackResource /index.php
    </Directory>

    # The upload directory holds user-supplied files, so it gets two independent layers:
    #   1. PHP is switched off, so nothing there can execute even if validation is bypassed.
    #   2. Script extensions are refused outright, so their source is not even served.
    # Layer 1 alone was verified working, but it still returned the raw file body with a
    # 200; layer 2 closes that.
    <Directory ${APACHE_DOCUMENT_ROOT}/uploads>
        php_admin_flag engine off
        Options -ExecCGI -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted

        <FilesMatch "\.(php|phar|phtml|php[0-9]|shtml|cgi|pl|py|htaccess)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # Logs go to the container's stdout/stderr so `docker compose logs` is the one place
    # to look. Nothing is written to a file inside the image.
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
